<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f4ebe4" />
  <title>Parcerias da semana — TESTE · Duda Vitti</title>
  <style>
    :root {
      --bg: #f4ebe4;
      --card: #fffaf7;
      --ink: #2b2420;
      --muted: #7a6f68;
      --line: #eadfd6;
      --accent: #c56b5c;
      --accent-soft: #f3d6cf;
      --ok: #3d7a5c;
      --ok-soft: #dceee4;
      --warn: #9a6b2f;
      --warn-soft: #f7e7c8;
      --sent: #b8aea6;
      --shadow: 0 6px 20px rgba(43, 36, 32, 0.06);
      --radius: 16px;
      --tap: 48px;
      --bar-h: 58px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.4; -webkit-text-size-adjust: 100%;
    }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    button, a { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      height: calc(var(--bar-h) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 12px 0;
      display: flex; align-items: center; gap: 10px;
      background: rgba(244, 235, 228, 0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      min-width: var(--tap); min-height: var(--tap);
      border: none; background: transparent; color: var(--ink);
      border-radius: 12px; display: grid; place-items: center;
      font-size: 1.35rem; cursor: pointer;
    }
    .topbar-main { flex: 1; min-width: 0; }
    .topbar-title { font-weight: 800; font-size: 1rem; letter-spacing: -0.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { margin: 1px 0 0; font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .badge-test {
      font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 4px 8px; flex-shrink: 0;
    }
    main { max-width: 480px; margin: 0 auto; padding: 14px 14px 28px; }
    .hint {
      font-size: 0.88rem; color: var(--muted); margin: 0 0 14px;
      background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px;
    }
    .day-card, .brand-row {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
    }
    .day-card {
      display: flex; align-items: center; gap: 12px; width: 100%;
      min-height: 72px; padding: 14px 16px; text-align: left;
      border: 1px solid var(--line); cursor: pointer; color: inherit; background: var(--card);
    }
    .day-card:active { transform: scale(0.99); }
    .day-card .chev { color: var(--muted); font-size: 1.2rem; }
    .day-meta { flex: 1; min-width: 0; }
    .day-title { font-weight: 800; font-size: 1.05rem; margin: 0 0 3px; letter-spacing: -0.02em; }
    .day-count { margin: 0; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .brand-head {
      width: 100%; display: flex; align-items: center; gap: 10px;
      min-height: 64px; padding: 12px 14px; border: none; background: transparent;
      text-align: left; cursor: pointer; color: inherit;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      flex-shrink: 0; box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .status-dot.sent { background: var(--sent); box-shadow: 0 0 0 3px #ece7e2; }
    .brand-head-text { flex: 1; min-width: 0; }
    .brand-name { font-weight: 800; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .niche-tag {
      display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted);
      background: #f0e8e1; border-radius: 999px; padding: 3px 8px; margin-top: 4px;
    }
    .example-chip {
      font-size: 10px; font-weight: 800; color: var(--warn); background: var(--warn-soft);
      border-radius: 6px; padding: 2px 6px; letter-spacing: 0.03em;
    }
    .chev { transition: transform .18s ease; color: var(--muted); }
    .brand-row.open .chev { transform: rotate(180deg); }
    .brand-row.sent-row { opacity: 0.62; }
    .brand-row.sent-row .brand-name { color: var(--muted); }
    .brand-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .brand-row.open .brand-body { display: block; }
    .reasons { margin: 12px 0; padding: 0 0 0 18px; }
    .reasons li { margin: 0 0 6px; font-size: 0.92rem; }
    .dm-box {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    }
    .dm-label { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .dm-preview {
      width: 100%; border: none; background: transparent; text-align: left; padding: 0;
      color: var(--ink); font-size: 0.92rem; cursor: pointer; white-space: pre-wrap;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dm-preview.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .dm-toggle { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-top: 6px; border: none; background: none; padding: 0; cursor: pointer; }
    .handle-line { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
    .handle-line strong { color: var(--ink); }
    .actions { display: grid; gap: 8px; }
    .btn {
      min-height: var(--tap); border-radius: 14px; border: none; font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer;
      padding: 12px 14px; width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn-copy { background: var(--accent); color: #fff; }
    .btn-copy.copied { background: var(--ok); }
    .btn-ig { background: linear-gradient(135deg, #f58529, #dd2a7b 55%, #8134af); color: #fff; }
    .btn-toggle {
      background: #fff; color: var(--ink); border: 1.5px solid var(--line); font-size: 0.92rem;
    }
    .btn-toggle.on { background: var(--ok-soft); border-color: #b9dcc8; color: var(--ok); }
    .copy-hint { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; text-align: center; }
    .fallback { display: none; margin-top: 8px; }
    .fallback textarea {
      width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--line);
      padding: 10px; font: inherit; font-size: 0.88rem;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(43,36,32,.35); z-index: 50;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); z-index: 60;
      background: #fffaf7; box-shadow: 8px 0 30px rgba(0,0,0,.12);
      transform: translateX(-105%); transition: transform .22s ease;
      padding: calc(12px + env(safe-area-inset-top)) 0 20px; overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { margin: 0 16px 12px; font-size: 1.05rem; }
    .drawer-section { padding: 8px 8px 4px; }
    .drawer-day, .drawer-brand {
      width: 100%; text-align: left; border: none; background: transparent;
      min-height: 46px; padding: 10px 16px; font-weight: 700; color: var(--ink); cursor: pointer; border-radius: 10px;
    }
    .drawer-day:active, .drawer-brand:active { background: var(--accent-soft); }
    .drawer-brand { font-weight: 600; color: var(--muted); padding-left: 28px; font-size: 0.92rem; }
    .hidden { display: none !important; }
    #view-brands.hidden, #view-days.hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="btnMenu" aria-label="Menu">☰</button>
    <button type="button" class="icon-btn hidden" id="btnBack" aria-label="Voltar">←</button>
    <div class="topbar-main">
      <p class="topbar-title" id="barTitle">Parcerias da semana — TESTE</p>
      <p class="topbar-sub" id="barSub">0/0 enviadas</p>
    </div>
    <span class="badge-test">TESTE</span>
  </header>

  <main>
    <p class="hint" id="globalHint">Formato Instagram DM · Copie, abra o perfil, toque em Mensagem e cole</p>

    <section id="view-days"></section>
    <section id="view-brands" class="hidden"></section>
  </main>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <h2>Rodadas</h2>
    <div id="drawerContent"></div>
  </aside>

  <script>
  (function () {
    var LS_SENT = "duda-parcerias-sent-v1";
    var LS_NAV = "duda-parcerias-nav-v1";
    var data = null;
    var currentDayId = null;
    var openBrandId = null;
    var applyingHistory = false;
    var pendingScrollBrand = null;

    var elDays = document.getElementById("view-days");
    var elBrands = document.getElementById("view-brands");
    var barTitle = document.getElementById("barTitle");
    var barSub = document.getElementById("barSub");
    var btnBack = document.getElementById("btnBack");
    var btnMenu = document.getElementById("btnMenu");
    var drawer = document.getElementById("drawer");
    var overlay = document.getElementById("drawerOverlay");
    var drawerContent = document.getElementById("drawerContent");

    function loadSent() {
      try { return JSON.parse(localStorage.getItem(LS_SENT) || "{}") || {}; }
      catch (e) { return {}; }
    }
    function saveSent(map) { localStorage.setItem(LS_SENT, JSON.stringify(map)); }
    function isSent(id) { return !!loadSent()[id]; }
    function setSent(id, val) {
      var m = loadSent();
      if (val) m[id] = true; else delete m[id];
      saveSent(m);
    }

    function navState() {
      return { dayId: currentDayId || null, brandId: openBrandId || null };
    }
    function persistNav() {
      var st = navState();
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      var hash = "";
      if (st.dayId) {
        hash = "#dia=" + encodeURIComponent(st.dayId);
        if (st.brandId) hash += "&marca=" + encodeURIComponent(st.brandId);
      }
      if (location.hash !== hash) {
        if (!hash) {
          history.replaceState(st, "", location.pathname + location.search);
        } else if (applyingHistory) {
          history.replaceState(st, "", location.pathname + location.search + hash);
        } else {
          // hash kept in sync by pushState urls
        }
      }
    }
    function readStoredNav() {
      var fromHash = parseHash();
      if (fromHash.dayId) return fromHash;
      try {
        var s = sessionStorage.getItem(LS_NAV) || localStorage.getItem(LS_NAV);
        if (s) return JSON.parse(s) || {};
      } catch (e) {}
      return {};
    }
    function parseHash() {
      var h = (location.hash || "").replace(/^#/, "");
      if (!h) return {};
      var out = {};
      h.split("&").forEach(function (part) {
        var kv = part.split("=");
        var k = decodeURIComponent(kv[0] || "");
        var v = decodeURIComponent(kv[1] || "");
        if (k === "dia") out.dayId = v;
        if (k === "marca") out.brandId = v;
      });
      return out;
    }
    function urlFor(dayId, brandId) {
      var base = location.pathname + location.search;
      if (!dayId) return base;
      var hash = "#dia=" + encodeURIComponent(dayId);
      if (brandId) hash += "&marca=" + encodeURIComponent(brandId);
      return base + hash;
    }

    /** level: 0 days, 1 day list, 2 brand open */
    function levelOf(st) {
      if (st && st.brandId && st.dayId) return 2;
      if (st && st.dayId) return 1;
      return 0;
    }

    function pushNav(dayId, brandId) {
      if (applyingHistory) return;
      var st = { dayId: dayId || null, brandId: brandId || null };
      history.pushState(st, "", urlFor(st.dayId, st.brandId));
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }
    function replaceNav(dayId, brandId) {
      var st = { dayId: dayId || null, brandId: brandId || null };
      history.replaceState(st, "", urlFor(st.dayId, st.brandId));
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }

    function parseDate(iso) {
      var p = iso.split("-");
      return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    var WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    function dayLabel(iso) {
      var d = parseDate(iso);
      var today = new Date();
      var same = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      var dd = String(d.getDate()).padStart(2, "0");
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var w = WEEKDAYS[d.getDay()];
      if (same) return "Hoje · " + w + " " + dd + "/" + mm;
      return w.charAt(0).toUpperCase() + w.slice(1) + " " + dd + "/" + mm;
    }

    function allBrands() {
      var out = [];
      (data.rounds || []).forEach(function (r) {
        (r.brands || []).forEach(function (b) { out.push(b); });
      });
      return out;
    }
    function countSentIn(brands) {
      var n = 0;
      brands.forEach(function (b) { if (isSent(b.id)) n++; });
      return n;
    }
    function updateCounter() {
      var brands = currentDayId
        ? ((data.rounds.find(function (r) { return r.id === currentDayId; }) || {}).brands || [])
        : allBrands();
      var sent = countSentIn(brands);
      var total = brands.length;
      barSub.textContent = currentDayId
        ? (sent + "/" + total + " enviadas neste dia")
        : (sent + "/" + total + " enviadas");
    }
    function sortedRounds() {
      return (data.rounds || []).slice().sort(function (a, b) {
        return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
      });
    }
    function findRound(dayId) {
      return (data.rounds || []).find(function (r) { return r.id === dayId; });
    }

    function showDaysView(opts) {
      opts = opts || {};
      currentDayId = null;
      openBrandId = null;
      elDays.classList.remove("hidden");
      elBrands.classList.add("hidden");
      btnBack.classList.add("hidden");
      btnMenu.classList.remove("hidden");
      barTitle.textContent = "Parcerias da semana — TESTE";
      elDays.innerHTML = "";
      var rounds = sortedRounds();
      if (!rounds.length) {
        elDays.innerHTML = '<p class="empty">Nenhuma rodada ainda.</p>';
      } else {
        rounds.forEach(function (r) {
          var brands = r.brands || [];
          var sent = countSentIn(brands);
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "day-card";
          btn.innerHTML =
            '<div class="day-meta"><p class="day-title">' + escapeHtml(dayLabel(r.date)) + '</p>' +
            '<p class="day-count">' + brands.length + " marca" + (brands.length === 1 ? "" : "s") +
            " · " + sent + " enviada" + (sent === 1 ? "" : "s") + "</p></div>" +
            '<span class="chev">›</span>';
          btn.addEventListener("click", function () { goToDay(r.id); });
          elDays.appendChild(btn);
        });
      }
      updateCounter();
      renderDrawer();
      if (!opts.skipHistory) {
        if (opts.replace) replaceNav(null, null);
        else pushNav(null, null);
      } else {
        persistNavSilent();
      }
    }

    function showDayView(dayId, brandId, opts) {
      opts = opts || {};
      var round = findRound(dayId);
      if (!round) {
        showDaysView({ replace: true, skipHistory: opts.skipHistory });
        return;
      }
      currentDayId = dayId;
      openBrandId = brandId || null;
      elDays.classList.add("hidden");
      elBrands.classList.remove("hidden");
      btnBack.classList.remove("hidden");
      barTitle.textContent = dayLabel(round.date);
      if (brandId) pendingScrollBrand = brandId;
      renderBrands(round);
      updateCounter();
      closeDrawer();
      if (!opts.skipHistory) {
        if (opts.replace) replaceNav(dayId, brandId || null);
        else pushNav(dayId, brandId || null);
      } else {
        persistNavSilent();
      }
      if (brandId) {
        setTimeout(function () {
          var el = elBrands.querySelector('[data-id="' + cssEscape(brandId) + '"]');
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 50);
      }
    }

    function persistNavSilent() {
      var st = navState();
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }

    function goToDay(dayId) {
      showDayView(dayId, null, { replace: false });
    }

    /** Ensure history stack is days -> day -> brand so one back = one level. */
    function ensureDayThenBrand(dayId, brandId) {
      if (currentDayId === dayId && openBrandId === brandId) return;
      if (currentDayId === dayId && !openBrandId) {
        showDayView(dayId, brandId, { replace: false });
        return;
      }
      if (currentDayId === dayId && openBrandId && openBrandId !== brandId) {
        showDayView(dayId, brandId, { replace: true });
        return;
      }
      if (currentDayId === dayId && openBrandId === brandId) {
        showDayView(dayId, null, { replace: true });
        return;
      }
      // coming from another day or from days list: push day, then brand
      if (currentDayId !== dayId) {
        showDayView(dayId, null, { replace: !!currentDayId });
      }
      showDayView(dayId, brandId, { replace: false });
    }

    function oneLevelUp() {
      if (openBrandId && currentDayId) {
        showDayView(currentDayId, null, { replace: true });
        return;
      }
      if (currentDayId) {
        showDaysView({ replace: true });
      }
    }

    function backButtonHandler() {
      var lvl = levelOf(navState());
      if (lvl <= 0) return;
      var snapshot = JSON.stringify(navState());
      var settled = false;
      function fallback() {
        if (settled) return;
        if (JSON.stringify(navState()) !== snapshot) { settled = true; return; }
        settled = true;
        oneLevelUp();
      }
      function onPop() {
        settled = true;
        window.removeEventListener("popstate", onPop);
      }
      window.addEventListener("popstate", onPop);
      history.back();
      setTimeout(fallback, 150);
    }

    function applyState(st, opts) {
      opts = opts || {};
      applyingHistory = true;
      try {
        st = st || {};
        var dayId = st.dayId || null;
        var brandId = st.brandId || null;
        if (dayId && findRound(dayId)) {
          showDayView(dayId, brandId, { skipHistory: true });
        } else {
          showDaysView({ skipHistory: true });
        }
      } finally {
        applyingHistory = false;
        persistNavSilent();
      }
    }

    function sortBrands(brands) {
      return brands.slice().sort(function (a, b) {
        var sa = isSent(a.id) ? 1 : 0;
        var sb = isSent(b.id) ? 1 : 0;
        return sa - sb;
      });
    }

    function cssEscape(id) {
      if (window.CSS && CSS.escape) return CSS.escape(id);
      return String(id).replace(/"/g, '\\"');
    }

    function renderBrands(round) {
      elBrands.innerHTML = "";
      var brands = sortBrands(round.brands || []);
      brands.forEach(function (b) {
        var row = document.createElement("article");
        row.className = "brand-row" + (isSent(b.id) ? " sent-row" : "") + (openBrandId === b.id ? " open" : "");
        row.dataset.id = b.id;

        var head = document.createElement("button");
        head.type = "button";
        head.className = "brand-head";
        head.setAttribute("aria-expanded", openBrandId === b.id ? "true" : "false");
        head.innerHTML =
          '<span class="status-dot' + (isSent(b.id) ? " sent" : "") + '"></span>' +
          '<div class="brand-head-text"><p class="brand-name">' + escapeHtml(b.name) +
          (b.example ? ' <span class="example-chip">EXEMPLO</span>' : "") + "</p>" +
          '<span class="niche-tag">' + escapeHtml(b.niche || "") + "</span></div>" +
          '<span class="chev">▾</span>';
        head.addEventListener("click", function () {
          if (openBrandId === b.id) {
            // close brand: one level up via history when possible
            history.back();
            setTimeout(function () {
              if (openBrandId === b.id) showDayView(round.id, null, { replace: true });
            }, 160);
          } else if (openBrandId) {
            showDayView(round.id, b.id, { replace: true });
          } else {
            showDayView(round.id, b.id, { replace: false });
          }
        });

        var body = document.createElement("div");
        body.className = "brand-body";
        var reasons = (b.reasons || []).map(function (r) { return "<li>" + escapeHtml(r) + "</li>"; }).join("");
        body.innerHTML =
          "<ul class=\"reasons\">" + reasons + "</ul>" +
          '<div class="dm-box">' +
            '<div class="dm-label">Mensagem (DM)</div>' +
            '<button type="button" class="dm-preview" id="dm-' + escapeAttr(b.id) + '">' + escapeHtml(b.dm) + "</button>" +
            '<button type="button" class="dm-toggle" data-dm="' + escapeAttr(b.id) + '">Ver mensagem</button>' +
          "</div>" +
          '<p class="handle-line">Instagram: <strong>@' + escapeHtml(b.handle) + "</strong>" +
          (b.followersNote ? " · " + escapeHtml(b.followersNote) : "") + "</p>" +
          '<div class="actions">' +
            '<button type="button" class="btn btn-copy" data-copy="' + escapeAttr(b.id) + '">Copiar mensagem</button>' +
            '<a class="btn btn-ig" href="' + escapeAttr(b.instagramUrl) + '" target="_blank" rel="noopener noreferrer">Abrir Instagram · @' + escapeHtml(b.handle) + "</a>" +
            '<button type="button" class="btn btn-toggle' + (isSent(b.id) ? " on" : "") + '" data-toggle="' + escapeAttr(b.id) + '">' +
              (isSent(b.id) ? "✓ Enviada (desmarcar)" : "Marcar como enviada") +
            "</button>" +
          "</div>" +
          '<p class="copy-hint">Copie, abra o perfil, toque em Mensagem e cole</p>' +
          '<div class="fallback" id="fb-' + escapeAttr(b.id) + '"><textarea readonly></textarea></div>';

        row.appendChild(head);
        row.appendChild(body);
        elBrands.appendChild(row);
      });

      elBrands.querySelectorAll(".dm-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-dm");
          var prev = document.getElementById("dm-" + id);
          var open = prev.classList.toggle("expanded");
          btn.textContent = open ? "Ocultar mensagem" : "Ver mensagem";
        });
      });
      elBrands.querySelectorAll(".dm-preview").forEach(function (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("expanded");
          var id = btn.id.replace(/^dm-/, "");
          var t = elBrands.querySelector('.dm-toggle[data-dm="' + cssEscape(id) + '"]');
          if (t) t.textContent = btn.classList.contains("expanded") ? "Ocultar mensagem" : "Ver mensagem";
        });
      });
      elBrands.querySelectorAll("[data-copy]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-copy");
          var brand = (round.brands || []).find(function (x) { return x.id === id; });
          if (!brand) return;
          // keep day+brand in nav before leaving to IG
          persistNavSilent();
          replaceNav(round.id, openBrandId || id);
          copyText(brand.dm, btn, id);
        });
      });
      elBrands.querySelectorAll("[data-toggle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-toggle");
          setSent(id, !isSent(id));
          updateCounter();
          renderBrands(round);
          renderDrawer();
        });
      });
      // ensure IG links re-persist nav on click
      elBrands.querySelectorAll("a.btn-ig").forEach(function (a) {
        a.addEventListener("click", function () {
          persistNavSilent();
          replaceNav(currentDayId, openBrandId);
        });
      });
    }

    function copyText(text, btn, id) {
      function ok() {
        var old = btn.textContent;
        btn.textContent = "Copiado!";
        btn.classList.add("copied");
        setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1800);
      }
      function fallback() {
        var box = document.getElementById("fb-" + id);
        if (!box) return;
        box.style.display = "block";
        var ta = box.querySelector("textarea");
        ta.value = text;
        ta.focus(); ta.select();
        try { if (document.execCommand("copy")) ok(); } catch (e) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(fallback);
      } else fallback();
    }

    function renderDrawer() {
      drawerContent.innerHTML = "";
      sortedRounds().forEach(function (r) {
        var sec = document.createElement("div");
        sec.className = "drawer-section";
        var dayBtn = document.createElement("button");
        dayBtn.type = "button";
        dayBtn.className = "drawer-day";
        dayBtn.textContent = dayLabel(r.date) + " (" + (r.brands || []).length + ")";
        dayBtn.addEventListener("click", function () {
          closeDrawer();
          if (currentDayId === r.id && !openBrandId) return;
          if (!currentDayId) goToDay(r.id);
          else showDayView(r.id, null, { replace: true });
        });
        sec.appendChild(dayBtn);
        (r.brands || []).forEach(function (b) {
          var bb = document.createElement("button");
          bb.type = "button";
          bb.className = "drawer-brand";
          bb.textContent = (isSent(b.id) ? "✓ " : "• ") + b.name + " @" + b.handle;
          bb.addEventListener("click", function () {
            closeDrawer();
            ensureDayThenBrand(r.id, b.id);
          });
          sec.appendChild(bb);
        });
        drawerContent.appendChild(sec);
      });
    }

    function openDrawer() {
      drawer.classList.add("open");
      overlay.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }
    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

    function restoreFromStorageOrHash() {
      var st = parseHash();
      if (!st.dayId) st = readStoredNav();
      applyState(st);
    }

    btnMenu.addEventListener("click", openDrawer);
    overlay.addEventListener("click", closeDrawer);
    btnBack.addEventListener("click", function (e) {
      e.preventDefault();
      backButtonHandler();
    });

    window.addEventListener("popstate", function (ev) {
      var st = ev.state;
      if (!st || typeof st !== "object") st = parseHash();
      applyState(st);
    });
    window.addEventListener("hashchange", function () {
      if (applyingHistory) return;
      applyState(parseHash());
    });
    window.addEventListener("pageshow", function () {
      if (!data) return;
      restoreFromStorageOrHash();
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && data) {
        // Keep current view; re-sync from storage if reload wiped memory but hash/storage remain
        var st = readStoredNav();
        if (st.dayId && st.dayId !== currentDayId) applyState(st);
        else if (st.dayId && st.brandId && st.brandId !== openBrandId) applyState(st);
        else persistNavSilent();
      }
    });

    fetch("data.json?v=" + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error("data.json " + r.status);
        return r.json();
      })
      .then(function (json) {
        data = json;
        var st = parseHash();
        if (!st.dayId) st = readStoredNav();
        if (st.dayId && findRound(st.dayId)) {
          // Seed history: days -> (day) -> (brand?) so back works one level at a time
          replaceNav(null, null);
          if (st.brandId) {
            history.pushState({ dayId: st.dayId, brandId: null }, "", urlFor(st.dayId, null));
            history.pushState({ dayId: st.dayId, brandId: st.brandId }, "", urlFor(st.dayId, st.brandId));
          } else {
            history.pushState({ dayId: st.dayId, brandId: null }, "", urlFor(st.dayId, null));
          }
          applyState(st);
        } else {
          replaceNav(null, null);
          showDaysView({ skipHistory: true });
        }
      })
      .catch(function (err) {
        elDays.innerHTML = '<p class="empty">Erro ao carregar data.json<br>' + escapeHtml(String(err)) + "</p>";
      });
  })();
  </script>
</body>
</html>
