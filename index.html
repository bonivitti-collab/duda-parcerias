<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f6efe8" />
  <title>Parcerias da semana — TESTE · Duda Vitti</title>
  <style>
    :root {
      --bg: #f6efe8;
      --card: #fffaf6;
      --ink: #2f2622;
      --muted: #8a7a72;
      --line: #eadfd6;
      --rose: #c97b7b;
      --rose-soft: #f3ddd8;
      --accent: #c56b5c;
      --accent-soft: #f3d6cf;
      --ok: #3d7a5c;
      --ok-soft: #dceee4;
      --warn: #9a6b2f;
      --warn-soft: #f7e7c8;
      --sent: #b8aea6;
      --coffee: #8b5e3c;
      --coffee-soft: #f3e8dc;
      --love: #b85c6e;
      --love-soft: #f7e2e7;
      --shadow: 0 6px 20px rgba(43, 36, 32, 0.06);
      --radius: 16px;
      --tap: 48px;
      --bar-h: 58px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45; -webkit-text-size-adjust: 100%;
    }
    body { min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
    button, a { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      height: calc(var(--bar-h) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 12px 0;
      display: flex; align-items: center; gap: 10px;
      background: rgba(246, 239, 232, 0.94);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      min-width: var(--tap); min-height: var(--tap);
      border: none; background: transparent; color: var(--ink);
      border-radius: 12px; display: grid; place-items: center;
      font-size: 1.35rem; cursor: pointer;
    }
    .topbar-main { flex: 1; min-width: 0; }
    .topbar-title { font-weight: 800; font-size: 1rem; letter-spacing: -0.02em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { margin: 1px 0 0; font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .badge-test {
      font-size: 10px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 4px 8px; flex-shrink: 0;
    }
    main { max-width: 480px; margin: 0 auto; padding: 14px 14px 28px; }

    .hello {
      display: flex; flex-direction: row; align-items: center; gap: 12px;
      background: linear-gradient(145deg, #fffaf6 0%, #f8ebe4 100%);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 14px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
      object-fit: cover; display: block;
      border: 2px solid #e8b4ae;
      box-shadow: 0 0 0 3px #fff8f4;
      align-self: center; background: #f3ddd8;
    }
    .hello-text {
      min-width: 0; flex: 1;
      display: flex; flex-direction: column; justify-content: center;
    }
    .hello-hi {
      margin: 0; font-weight: 800; font-size: 1.12rem; letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .hello-sub { margin: 4px 0 0; font-size: 0.86rem; color: var(--muted); font-weight: 500; }
    .special-card {
      width: 100%; text-align: left; cursor: pointer; color: inherit;
      border-radius: 18px; box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
      padding: 0; display: block; border: 1px solid #e6d5c4;
      background: linear-gradient(160deg, #fff9f2 0%, #f4e6d8 100%);
      position: relative;
    }
    .special-card.love {
      border-color: #ebcfd6;
      background: linear-gradient(160deg, #fff7f8 0%, #f8e6ea 100%);
    }
    .special-card-head {
      display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px;
    }
    .special-icon {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      background: var(--coffee-soft); color: var(--coffee);
      display: grid; place-items: center; font-size: 1.3rem;
    }
    .special-card.love .special-icon { background: var(--love-soft); color: var(--love); }
    .special-meta { flex: 1; min-width: 0; }
    .special-kicker {
      margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--coffee);
    }
    .special-card.love .special-kicker { color: var(--love); }
    .special-title { margin: 2px 0 0; font-weight: 800; font-size: 1.02rem; letter-spacing: -0.02em; }
    .special-date { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .special-chev { color: var(--muted); font-size: 1.15rem; padding-right: 4px; transition: transform .18s ease; }
    .special-card.open .special-chev { transform: rotate(90deg); }
    .special-body { display: none; padding: 0 14px 16px; border-top: 1px solid #ead9c8; }
    .special-card.love .special-body { border-top-color: #ebcfd6; }
    .special-card.open .special-body { display: block; }

    .pulse-dot {
      position: absolute; top: 12px; right: 12px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--rose);
      box-shadow: 0 0 0 0 rgba(201, 123, 123, 0.55);
      animation: softPulse 1.8s ease-out infinite;
      pointer-events: none;
    }
    .special-card.love .pulse-dot {
      background: var(--love);
      box-shadow: 0 0 0 0 rgba(184, 92, 110, 0.5);
    }
    .pulse-dot.hidden-dot { display: none; }
    @keyframes softPulse {
      0% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(201, 123, 123, 0.45); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(201, 123, 123, 0); }
      100% { transform: scale(0.92); box-shadow: 0 0 0 0 rgba(201, 123, 123, 0); }
    }

    .cafe-verse-box {
      margin-top: 12px; background: #fffaf6; border: 1px solid #ead9c8;
      border-radius: 14px; padding: 12px 14px;
    }
    .cafe-ref { margin: 0 0 6px; font-size: 0.8rem; font-weight: 800; color: var(--coffee); }
    .cafe-verse { margin: 0; font-size: 0.95rem; font-style: italic; line-height: 1.5; }
    .cafe-trad { margin: 8px 0 0; font-size: 0.72rem; color: var(--muted); }
    .cafe-block-label {
      margin: 14px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--rose);
    }
    .special-card.love .cafe-block-label { color: var(--love); }
    .cafe-reflexao, .cafe-oracao, .cafe-hoje { margin: 0; font-size: 0.92rem; line-height: 1.55; }
    .cafe-hoje {
      background: var(--rose-soft); border-radius: 12px; padding: 10px 12px; font-weight: 600;
    }
    .poem-lines {
      margin: 12px 0 0; padding: 0; list-style: none;
      font-size: 0.98rem; line-height: 1.65; color: var(--ink);
    }
    .poem-lines li { margin: 0 0 2px; }
    .poem-sign {
      margin: 14px 0 0; font-size: 0.85rem; color: var(--love); font-weight: 700; text-align: right;
    }

    .day-card, .brand-row {
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden;
    }
    .day-card {
      display: flex; align-items: center; gap: 12px; width: 100%;
      min-height: 72px; padding: 14px 16px; text-align: left;
      border: 1px solid var(--line); cursor: pointer; color: inherit; background: var(--card);
    }
    .day-card:active { transform: scale(0.99); }
    .day-card .chev { color: var(--muted); font-size: 1.2rem; }
    .day-meta { flex: 1; min-width: 0; }
    .day-title { font-weight: 800; font-size: 1.05rem; margin: 0 0 3px; letter-spacing: -0.02em; }
    .day-count { margin: 0; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
    .brand-head {
      width: 100%; display: flex; align-items: center; gap: 10px;
      min-height: 64px; padding: 12px 14px; border: none; background: transparent;
      text-align: left; cursor: pointer; color: inherit;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--accent);
      flex-shrink: 0; box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .status-dot.sent { background: var(--sent); box-shadow: 0 0 0 3px #ece7e2; }
    .brand-head-text { flex: 1; min-width: 0; }
    .brand-name { font-weight: 800; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .niche-tag {
      display: inline-block; font-size: 11px; font-weight: 700; color: var(--muted);
      background: #f0e8e1; border-radius: 999px; padding: 3px 8px; margin-top: 4px;
    }
    .example-chip {
      font-size: 10px; font-weight: 800; color: var(--warn); background: var(--warn-soft);
      border-radius: 6px; padding: 2px 6px; letter-spacing: 0.03em;
    }
    .chev { transition: transform .18s ease; color: var(--muted); }
    .brand-row.open .chev { transform: rotate(180deg); }
    .brand-row.sent-row { opacity: 0.62; }
    .brand-row.sent-row .brand-name { color: var(--muted); }
    .brand-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .brand-row.open .brand-body { display: block; }
    .reasons { margin: 12px 0; padding: 0 0 0 18px; }
    .reasons li { margin: 0 0 6px; font-size: 0.92rem; }
    .dm-box {
      background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px;
    }
    .dm-label { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .dm-preview {
      width: 100%; border: none; background: transparent; text-align: left; padding: 0;
      color: var(--ink); font-size: 0.92rem; cursor: pointer; white-space: pre-wrap;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dm-preview.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .dm-toggle { font-size: 0.8rem; font-weight: 700; color: var(--accent); margin-top: 6px; border: none; background: none; padding: 0; cursor: pointer; }
    .handle-line { font-size: 0.85rem; color: var(--muted); margin: 0 0 10px; }
    .handle-line strong { color: var(--ink); }
    .actions { display: grid; gap: 8px; }
    .btn {
      min-height: var(--tap); border-radius: 14px; border: none; font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer;
      padding: 12px 14px; width: 100%;
    }
    .btn:active { transform: scale(0.98); }
    .btn-copy { background: var(--accent); color: #fff; }
    .btn-copy.copied { background: var(--ok); }
    .btn-ig { background: linear-gradient(135deg, #f58529, #dd2a7b 55%, #8134af); color: #fff; }
    .btn-toggle {
      background: #fff; color: var(--ink); border: 1.5px solid var(--line); font-size: 0.92rem;
    }
    .btn-toggle.on { background: var(--ok-soft); border-color: #b9dcc8; color: var(--ok); }
    .fallback { display: none; margin-top: 8px; }
    .fallback textarea {
      width: 100%; min-height: 110px; border-radius: 12px; border: 1px solid var(--line);
      padding: 10px; font: inherit; font-size: 0.88rem;
    }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(43,36,32,.35); z-index: 50;
      opacity: 0; pointer-events: none; transition: opacity .2s ease;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 320px); z-index: 60;
      background: #fffaf7; box-shadow: 8px 0 30px rgba(0,0,0,.12);
      transform: translateX(-105%); transition: transform .22s ease;
      padding: calc(12px + env(safe-area-inset-top)) 0 20px; overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h2 { margin: 0 16px 8px; font-size: 1.05rem; }
    .drawer-note { margin: 0 16px 12px; font-size: 0.8rem; color: var(--muted); }
    .drawer-section { padding: 8px 8px 4px; }
    .drawer-day, .drawer-brand, .drawer-special {
      width: 100%; text-align: left; border: none; background: transparent;
      min-height: 46px; padding: 10px 16px; font-weight: 700; color: var(--ink); cursor: pointer; border-radius: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .drawer-day:active, .drawer-brand:active, .drawer-special:active { background: var(--accent-soft); }
    .drawer-brand { font-weight: 600; color: var(--muted); padding-left: 28px; font-size: 0.92rem; }
    .drawer-special.cafe { color: var(--coffee); }
    .drawer-special.love { color: var(--love); }
    .drawer-pulse {
      width: 8px; height: 8px; border-radius: 50%; background: var(--rose);
      animation: softPulse 1.8s ease-out infinite; flex-shrink: 0;
    }
    .drawer-special.love .drawer-pulse { background: var(--love); }
    .hidden { display: none !important; }
    #view-brands.hidden, #view-days.hidden, #view-special.hidden { display: none !important; }

    .special-page {
      background: linear-gradient(180deg, #fff9f2 0%, #f6efe8 40%);
      border: 1px solid #e6d5c4; border-radius: 18px; padding: 16px 16px 20px;
      box-shadow: var(--shadow);
    }
    .special-page.love {
      background: linear-gradient(180deg, #fff7f8 0%, #f6efe8 40%);
      border-color: #ebcfd6;
    }
    .special-page-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .special-page-kicker {
      margin: 0; font-size: 11px; font-weight: 800; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--coffee);
    }
    .special-page.love .special-page-kicker { color: var(--love); }
    .special-page-title { margin: 2px 0 0; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .special-page-date { margin: 4px 0 0; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="btnMenu" aria-label="Menu">☰</button>
    <button type="button" class="icon-btn hidden" id="btnBack" aria-label="Voltar">←</button>
    <div class="topbar-main">
      <p class="topbar-title" id="barTitle">Parcerias da semana — TESTE</p>
      <p class="topbar-sub" id="barSub">0/0 enviadas</p>
    </div>
    <span class="badge-test">TESTE</span>
  </header>

  <main>
    <div class="hello" id="helloCard">
      <img class="avatar" src="avatar.jpg" width="48" height="48" alt="Duda Vitti" />
      <div class="hello-text">
        <p class="hello-hi">Oi, Duda ✨</p>
        <p class="hello-sub">Bora fechar parcerias lindas hoje?</p>
      </div>
    </div>

    <section id="view-days"></section>
    <section id="view-brands" class="hidden"></section>
    <section id="view-special" class="hidden"></section>
  </main>

  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <h2>Menu</h2>
    <p class="drawer-note">Moda · lifestyle · maternidade · RJ</p>
    <div id="drawerContent"></div>
  </aside>

  <script>
  (function () {
    var LS_SENT = "duda-parcerias-sent-v1";
    var LS_NAV = "duda-parcerias-nav-v1";
    var LS_SEEN = "duda-parcerias-seen-v1";
    var data = null;
    var currentDayId = null;
    var openBrandId = null;
    var specialOpen = null; // 'cafe' | 'poema' | null
    var applyingHistory = false;
    var homeOpen = { cafe: false, poema: false };

    var elDays = document.getElementById("view-days");
    var elBrands = document.getElementById("view-brands");
    var elSpecial = document.getElementById("view-special");
    var barTitle = document.getElementById("barTitle");
    var barSub = document.getElementById("barSub");
    var btnBack = document.getElementById("btnBack");
    var btnMenu = document.getElementById("btnMenu");
    var drawer = document.getElementById("drawer");
    var overlay = document.getElementById("drawerOverlay");
    var drawerContent = document.getElementById("drawerContent");
    var helloCard = document.getElementById("helloCard");

    function loadSent() {
      try { return JSON.parse(localStorage.getItem(LS_SENT) || "{}") || {}; }
      catch (e) { return {}; }
    }
    function saveSent(map) { localStorage.setItem(LS_SENT, JSON.stringify(map)); }
    function isSent(id) { return !!loadSent()[id]; }
    function setSent(id, val) {
      var m = loadSent();
      if (val) m[id] = true; else delete m[id];
      saveSent(m);
    }

    function loadSeen() {
      try { return JSON.parse(localStorage.getItem(LS_SEEN) || "{}") || {}; }
      catch (e) { return {}; }
    }
    function seenKey(type, date) { return type + ":" + date; }
    function hasSeen(type, date) {
      if (!date) return true;
      return !!loadSeen()[seenKey(type, date)];
    }
    function markSeen(type, date) {
      if (!date) return;
      var m = loadSeen();
      m[seenKey(type, date)] = true;
      localStorage.setItem(LS_SEEN, JSON.stringify(m));
    }

    function dailyDate() {
      return (data && data.daily && data.daily.date) || null;
    }
    function dailyDev() {
      return (data && data.daily && data.daily.devotional) || null;
    }
    function dailyPoem() {
      return (data && data.daily && data.daily.poema) || null;
    }

    function navState() {
      return {
        dayId: currentDayId || null,
        brandId: openBrandId || null,
        special: specialOpen || null
      };
    }
    function persistNavSilent() {
      var st = navState();
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }
    function parseHash() {
      var h = (location.hash || "").replace(/^#/, "");
      if (!h) return {};
      var out = {};
      h.split("&").forEach(function (part) {
        var kv = part.split("=");
        var k = decodeURIComponent(kv[0] || "");
        var v = decodeURIComponent(kv[1] || "");
        if (k === "dia") out.dayId = v;
        if (k === "marca") out.brandId = v;
        if (k === "msg" && (v === "cafe" || v === "poema")) out.special = v;
        if (k === "cafe" && (v === "1" || v === "true")) out.special = "cafe";
        if (k === "poema" && (v === "1" || v === "true")) out.special = "poema";
      });
      return out;
    }
    function readStoredNav() {
      var fromHash = parseHash();
      if (fromHash.dayId || fromHash.special) return fromHash;
      try {
        var s = sessionStorage.getItem(LS_NAV) || localStorage.getItem(LS_NAV);
        if (s) return JSON.parse(s) || {};
      } catch (e) {}
      return {};
    }
    function urlFor(dayId, brandId, special) {
      var base = location.pathname + location.search;
      if (special) return base + "#msg=" + encodeURIComponent(special);
      if (!dayId) return base;
      var hash = "#dia=" + encodeURIComponent(dayId);
      if (brandId) hash += "&marca=" + encodeURIComponent(brandId);
      return base + hash;
    }
    function levelOf(st) {
      if (st && st.special) return 1;
      if (st && st.brandId && st.dayId) return 2;
      if (st && st.dayId) return 1;
      return 0;
    }
    function pushNav(dayId, brandId, special) {
      if (applyingHistory) return;
      var st = { dayId: dayId || null, brandId: brandId || null, special: special || null };
      history.pushState(st, "", urlFor(st.dayId, st.brandId, st.special));
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }
    function replaceNav(dayId, brandId, special) {
      var st = { dayId: dayId || null, brandId: brandId || null, special: special || null };
      history.replaceState(st, "", urlFor(st.dayId, st.brandId, st.special));
      try { sessionStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
      try { localStorage.setItem(LS_NAV, JSON.stringify(st)); } catch (e) {}
    }

    function parseDate(iso) {
      var p = iso.split("-");
      return new Date(+p[0], +p[1] - 1, +p[2]);
    }
    var WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
    var WEEKDAYS_FULL = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
    function dayLabel(iso) {
      var d = parseDate(iso);
      var today = new Date();
      var same = d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      var dd = String(d.getDate()).padStart(2, "0");
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var w = WEEKDAYS[d.getDay()];
      if (same) return "Hoje · " + w + " " + dd + "/" + mm;
      return w.charAt(0).toUpperCase() + w.slice(1) + " " + dd + "/" + mm;
    }
    function fullDateLabel(iso) {
      var d = parseDate(iso);
      var dd = String(d.getDate()).padStart(2, "0");
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      return WEEKDAYS_FULL[d.getDay()] + ", " + dd + "/" + mm + "/" + d.getFullYear();
    }

    function allBrands() {
      var out = [];
      (data.rounds || []).forEach(function (r) {
        (r.brands || []).forEach(function (b) { out.push(b); });
      });
      return out;
    }
    function countSentIn(brands) {
      var n = 0;
      brands.forEach(function (b) { if (isSent(b.id)) n++; });
      return n;
    }
    function updateCounter() {
      if (specialOpen === "cafe") { barSub.textContent = "Um café com o Pai"; return; }
      if (specialOpen === "poema") { barSub.textContent = "Mensagem do Danillo"; return; }
      var brands = currentDayId
        ? ((data.rounds.find(function (r) { return r.id === currentDayId; }) || {}).brands || [])
        : allBrands();
      var sent = countSentIn(brands);
      var total = brands.length;
      barSub.textContent = currentDayId
        ? (sent + "/" + total + " enviadas neste dia")
        : (sent + "/" + total + " enviadas");
    }
    function sortedRounds() {
      return (data.rounds || []).slice().sort(function (a, b) {
        return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
      });
    }
    function findRound(dayId) {
      return (data.rounds || []).find(function (r) { return r.id === dayId; });
    }

    function setChromeHome() {
      helloCard.classList.remove("hidden");
      btnBack.classList.add("hidden");
      btnMenu.classList.remove("hidden");
    }
    function setChromeInner() {
      helloCard.classList.add("hidden");
      btnBack.classList.remove("hidden");
    }

    function cafeBodyHtml(dev) {
      return (
        '<div class="cafe-verse-box">' +
          '<p class="cafe-ref">' + escapeHtml(dev.ref || "") + "</p>" +
          '<p class="cafe-verse">“' + escapeHtml(dev.texto || "") + '”</p>' +
          (dev.traducao ? '<p class="cafe-trad">' + escapeHtml(dev.traducao) + "</p>" : "") +
        "</div>" +
        '<p class="cafe-block-label">Reflexão</p>' +
        '<p class="cafe-reflexao">' + escapeHtml(dev.reflexao || "") + "</p>" +
        '<p class="cafe-block-label">Oração do dia</p>' +
        '<p class="cafe-oracao">' + escapeHtml(dev.oracao || "") + "</p>" +
        (dev.paraHoje
          ? '<p class="cafe-block-label">Para hoje</p><p class="cafe-hoje">' + escapeHtml(dev.paraHoje) + "</p>"
          : "")
      );
    }
    function poemBodyHtml(poem) {
      var lines = (poem.versos || []).map(function (l) {
        return "<li>" + (l ? escapeHtml(l) : "&nbsp;") + "</li>";
      }).join("");
      return '<ul class="poem-lines">' + lines + '</ul><p class="poem-sign">— Danillo 💌</p>';
    }

    function makeHomeSpecialCard(type) {
      var date = dailyDate();
      var isCafe = type === "cafe";
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "special-card" + (isCafe ? "" : " love") + (homeOpen[type] ? " open" : "");
      btn.dataset.special = type;
      var unread = !hasSeen(type, date);
      var icon = isCafe ? "☕" : "💌";
      var kicker = isCafe ? "Um café com o Pai" : "Mensagem do Danillo";
      var title = isCafe
        ? ((dailyDev() || {}).titulo || "Mensagem do dia")
        : ((dailyPoem() || {}).titulo || "Poesia de hoje");
      var body = isCafe ? cafeBodyHtml(dailyDev() || {}) : poemBodyHtml(dailyPoem() || {});
      btn.innerHTML =
        (unread ? '<span class="pulse-dot" aria-hidden="true"></span>' : '<span class="pulse-dot hidden-dot" aria-hidden="true"></span>') +
        '<div class="special-card-head">' +
          '<div class="special-icon" aria-hidden="true">' + icon + "</div>" +
          '<div class="special-meta">' +
            '<p class="special-kicker">' + kicker + "</p>" +
            '<p class="special-title">' + escapeHtml(title) + "</p>" +
            '<p class="special-date">' + escapeHtml(fullDateLabel(date)) + "</p>" +
          "</div>" +
          '<span class="special-chev">›</span>' +
        "</div>" +
        '<div class="special-body">' + body + "</div>";
      btn.addEventListener("click", function () {
        var opening = !btn.classList.contains("open");
        homeOpen[type] = opening;
        btn.classList.toggle("open", opening);
        if (opening) {
          markSeen(type, date);
          var dot = btn.querySelector(".pulse-dot");
          if (dot) dot.classList.add("hidden-dot");
          renderDrawer();
        }
      });
      return btn;
    }

    function showDaysView(opts) {
      opts = opts || {};
      currentDayId = null;
      openBrandId = null;
      specialOpen = null;
      elDays.classList.remove("hidden");
      elBrands.classList.add("hidden");
      elSpecial.classList.add("hidden");
      setChromeHome();
      barTitle.textContent = "Parcerias da semana — TESTE";
      elDays.innerHTML = "";

      if (dailyDev()) elDays.appendChild(makeHomeSpecialCard("cafe"));
      if (dailyPoem()) elDays.appendChild(makeHomeSpecialCard("poema"));

      var rounds = sortedRounds();
      if (!rounds.length) {
        var empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Nenhuma rodada ainda.";
        elDays.appendChild(empty);
      } else {
        rounds.forEach(function (r) {
          var brands = r.brands || [];
          var sent = countSentIn(brands);
          var dayBtn = document.createElement("button");
          dayBtn.type = "button";
          dayBtn.className = "day-card";
          dayBtn.innerHTML =
            '<div class="day-meta"><p class="day-title">' + escapeHtml(dayLabel(r.date)) + '</p>' +
            '<p class="day-count">' + brands.length + " marca" + (brands.length === 1 ? "" : "s") +
            " · " + sent + " enviada" + (sent === 1 ? "" : "s") + "</p></div>" +
            '<span class="chev">›</span>';
          dayBtn.addEventListener("click", function () { goToDay(r.id); });
          elDays.appendChild(dayBtn);
        });
      }
      updateCounter();
      renderDrawer();
      if (!opts.skipHistory) {
        if (opts.replace) replaceNav(null, null, null);
        else pushNav(null, null, null);
      } else {
        persistNavSilent();
      }
    }

    function showSpecialView(type, opts) {
      opts = opts || {};
      var date = dailyDate();
      if (type === "cafe" && !dailyDev()) {
        showDaysView({ replace: true, skipHistory: opts.skipHistory });
        return;
      }
      if (type === "poema" && !dailyPoem()) {
        showDaysView({ replace: true, skipHistory: opts.skipHistory });
        return;
      }
      currentDayId = null;
      openBrandId = null;
      specialOpen = type;
      markSeen(type, date);
      elDays.classList.add("hidden");
      elBrands.classList.add("hidden");
      elSpecial.classList.remove("hidden");
      setChromeInner();
      var isCafe = type === "cafe";
      barTitle.textContent = isCafe ? "Um café com o Pai" : "Mensagem do Danillo";
      var page = document.createElement("div");
      page.className = "special-page" + (isCafe ? "" : " love");
      var title = isCafe ? (dailyDev().titulo || "") : (dailyPoem().titulo || "");
      page.innerHTML =
        '<div class="special-page-top">' +
          '<div class="special-icon" aria-hidden="true">' + (isCafe ? "☕" : "💌") + "</div>" +
          '<div>' +
            '<p class="special-page-kicker">' + (isCafe ? "Mensagem do dia" : "Do Danillo, com amor") + "</p>" +
            '<p class="special-page-title">' + escapeHtml(title) + "</p>" +
            '<p class="special-page-date">' + escapeHtml(fullDateLabel(date)) + "</p>" +
          "</div>" +
        "</div>" +
        (isCafe ? cafeBodyHtml(dailyDev()) : poemBodyHtml(dailyPoem()));
      elSpecial.innerHTML = "";
      elSpecial.appendChild(page);
      updateCounter();
      closeDrawer();
      renderDrawer();
      if (!opts.skipHistory) {
        if (opts.replace) replaceNav(null, null, type);
        else pushNav(null, null, type);
      } else {
        persistNavSilent();
      }
    }

    function showDayView(dayId, brandId, opts) {
      opts = opts || {};
      var round = findRound(dayId);
      if (!round) {
        showDaysView({ replace: true, skipHistory: opts.skipHistory });
        return;
      }
      currentDayId = dayId;
      openBrandId = brandId || null;
      specialOpen = null;
      elDays.classList.add("hidden");
      elSpecial.classList.add("hidden");
      elBrands.classList.remove("hidden");
      setChromeInner();
      barTitle.textContent = dayLabel(round.date);
      renderBrands(round);
      updateCounter();
      closeDrawer();
      if (!opts.skipHistory) {
        if (opts.replace) replaceNav(dayId, brandId || null, null);
        else pushNav(dayId, brandId || null, null);
      } else {
        persistNavSilent();
      }
      if (brandId) {
        setTimeout(function () {
          var el = elBrands.querySelector('[data-id="' + cssEscape(brandId) + '"]');
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 50);
      }
    }

    function goToDay(dayId) { showDayView(dayId, null, { replace: false }); }

    function ensureDayThenBrand(dayId, brandId) {
      if (currentDayId === dayId && openBrandId === brandId) return;
      if (currentDayId === dayId && !openBrandId) {
        showDayView(dayId, brandId, { replace: false });
        return;
      }
      if (currentDayId === dayId && openBrandId && openBrandId !== brandId) {
        showDayView(dayId, brandId, { replace: true });
        return;
      }
      if (currentDayId !== dayId) {
        showDayView(dayId, null, { replace: !!currentDayId || !!specialOpen });
      }
      showDayView(dayId, brandId, { replace: false });
    }

    function oneLevelUp() {
      if (specialOpen) { showDaysView({ replace: true }); return; }
      if (openBrandId && currentDayId) { showDayView(currentDayId, null, { replace: true }); return; }
      if (currentDayId) showDaysView({ replace: true });
    }

    function backButtonHandler() {
      var lvl = levelOf(navState());
      if (lvl <= 0) return;
      var snapshot = JSON.stringify(navState());
      var settled = false;
      function fallback() {
        if (settled) return;
        if (JSON.stringify(navState()) !== snapshot) { settled = true; return; }
        settled = true;
        oneLevelUp();
      }
      function onPop() {
        settled = true;
        window.removeEventListener("popstate", onPop);
      }
      window.addEventListener("popstate", onPop);
      history.back();
      setTimeout(fallback, 150);
    }

    function applyState(st) {
      applyingHistory = true;
      try {
        st = st || {};
        if (st.special === "cafe" || st.special === "poema") {
          showSpecialView(st.special, { skipHistory: true });
        } else if (st.dayId && findRound(st.dayId)) {
          showDayView(st.dayId, st.brandId || null, { skipHistory: true });
        } else {
          showDaysView({ skipHistory: true });
        }
      } finally {
        applyingHistory = false;
        persistNavSilent();
      }
    }

    function sortBrands(brands) {
      return brands.slice().sort(function (a, b) {
        return (isSent(a.id) ? 1 : 0) - (isSent(b.id) ? 1 : 0);
      });
    }
    function cssEscape(id) {
      if (window.CSS && CSS.escape) return CSS.escape(id);
      return String(id).replace(/"/g, '\\"');
    }

    function renderBrands(round) {
      elBrands.innerHTML = "";
      sortBrands(round.brands || []).forEach(function (b) {
        var row = document.createElement("article");
        row.className = "brand-row" + (isSent(b.id) ? " sent-row" : "") + (openBrandId === b.id ? " open" : "");
        row.dataset.id = b.id;
        var head = document.createElement("button");
        head.type = "button";
        head.className = "brand-head";
        head.setAttribute("aria-expanded", openBrandId === b.id ? "true" : "false");
        head.innerHTML =
          '<span class="status-dot' + (isSent(b.id) ? " sent" : "") + '"></span>' +
          '<div class="brand-head-text"><p class="brand-name">' + escapeHtml(b.name) +
          (b.example ? ' <span class="example-chip">EXEMPLO</span>' : "") + "</p>" +
          '<span class="niche-tag">' + escapeHtml(b.niche || "") + "</span></div>" +
          '<span class="chev">▾</span>';
        head.addEventListener("click", function () {
          if (openBrandId === b.id) {
            history.back();
            setTimeout(function () {
              if (openBrandId === b.id) showDayView(round.id, null, { replace: true });
            }, 160);
          } else if (openBrandId) {
            showDayView(round.id, b.id, { replace: true });
          } else {
            showDayView(round.id, b.id, { replace: false });
          }
        });
        var body = document.createElement("div");
        body.className = "brand-body";
        var reasons = (b.reasons || []).map(function (r) { return "<li>" + escapeHtml(r) + "</li>"; }).join("");
        body.innerHTML =
          "<ul class=\"reasons\">" + reasons + "</ul>" +
          '<div class="dm-box">' +
            '<div class="dm-label">Mensagem (DM)</div>' +
            '<button type="button" class="dm-preview" id="dm-' + escapeAttr(b.id) + '">' + escapeHtml(b.dm) + "</button>" +
            '<button type="button" class="dm-toggle" data-dm="' + escapeAttr(b.id) + '">Ver mensagem</button>' +
          "</div>" +
          '<p class="handle-line">Instagram: <strong>@' + escapeHtml(b.handle) + "</strong>" +
          (b.followersNote ? " · " + escapeHtml(b.followersNote) : "") + "</p>" +
          '<div class="actions">' +
            '<button type="button" class="btn btn-copy" data-copy="' + escapeAttr(b.id) + '">Copiar mensagem</button>' +
            '<a class="btn btn-ig" href="' + escapeAttr(b.instagramUrl) + '" target="_blank" rel="noopener noreferrer">Abrir Instagram · @' + escapeHtml(b.handle) + "</a>" +
            '<button type="button" class="btn btn-toggle' + (isSent(b.id) ? " on" : "") + '" data-toggle="' + escapeAttr(b.id) + '">' +
              (isSent(b.id) ? "✓ Enviada (desmarcar)" : "Marcar como enviada") +
            "</button>" +
          "</div>" +
          '<div class="fallback" id="fb-' + escapeAttr(b.id) + '"><textarea readonly></textarea></div>';
        row.appendChild(head);
        row.appendChild(body);
        elBrands.appendChild(row);
      });

      elBrands.querySelectorAll(".dm-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-dm");
          var prev = document.getElementById("dm-" + id);
          var open = prev.classList.toggle("expanded");
          btn.textContent = open ? "Ocultar mensagem" : "Ver mensagem";
        });
      });
      elBrands.querySelectorAll(".dm-preview").forEach(function (btn) {
        btn.addEventListener("click", function () {
          btn.classList.toggle("expanded");
          var id = btn.id.replace(/^dm-/, "");
          var t = elBrands.querySelector('.dm-toggle[data-dm="' + cssEscape(id) + '"]');
          if (t) t.textContent = btn.classList.contains("expanded") ? "Ocultar mensagem" : "Ver mensagem";
        });
      });
      elBrands.querySelectorAll("[data-copy]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-copy");
          var brand = (round.brands || []).find(function (x) { return x.id === id; });
          if (!brand) return;
          persistNavSilent();
          replaceNav(round.id, openBrandId || id, null);
          copyText(brand.dm, btn, id);
        });
      });
      elBrands.querySelectorAll("[data-toggle]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var id = btn.getAttribute("data-toggle");
          setSent(id, !isSent(id));
          updateCounter();
          renderBrands(round);
          renderDrawer();
        });
      });
      elBrands.querySelectorAll("a.btn-ig").forEach(function (a) {
        a.addEventListener("click", function () {
          persistNavSilent();
          replaceNav(currentDayId, openBrandId, null);
        });
      });
    }

    function copyText(text, btn, id) {
      function ok() {
        var old = btn.textContent;
        btn.textContent = "Copiado!";
        btn.classList.add("copied");
        setTimeout(function () { btn.textContent = old; btn.classList.remove("copied"); }, 1800);
      }
      function fallback() {
        var box = document.getElementById("fb-" + id);
        if (!box) return;
        box.style.display = "block";
        var ta = box.querySelector("textarea");
        ta.value = text;
        ta.focus(); ta.select();
        try { if (document.execCommand("copy")) ok(); } catch (e) {}
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok).catch(fallback);
      } else fallback();
    }

    function renderDrawer() {
      drawerContent.innerHTML = "";
      var date = dailyDate();

      function addSpecial(type, label, cls) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "drawer-special " + cls;
        var unread = !hasSeen(type, date);
        b.innerHTML = (unread ? '<span class="drawer-pulse" aria-hidden="true"></span>' : "") + "<span>" + label + "</span>";
        b.addEventListener("click", function () {
          closeDrawer();
          if (specialOpen === type) return;
          showSpecialView(type, { replace: false });
        });
        drawerContent.appendChild(b);
      }
      if (dailyDev()) addSpecial("cafe", "☕ Um café com o Pai", "cafe");
      if (dailyPoem()) addSpecial("poema", "💌 Mensagem do Danillo", "love");

      var secLabel = document.createElement("div");
      secLabel.className = "drawer-section";
      var h = document.createElement("button");
      h.type = "button";
      h.className = "drawer-day";
      h.textContent = "Rodadas";
      h.style.color = "var(--muted)";
      h.style.fontSize = "0.8rem";
      h.style.letterSpacing = "0.04em";
      h.style.textTransform = "uppercase";
      h.disabled = true;
      secLabel.appendChild(h);
      drawerContent.appendChild(secLabel);

      sortedRounds().forEach(function (r) {
        var sec = document.createElement("div");
        sec.className = "drawer-section";
        var dayBtn = document.createElement("button");
        dayBtn.type = "button";
        dayBtn.className = "drawer-day";
        dayBtn.textContent = dayLabel(r.date) + " (" + (r.brands || []).length + ")";
        dayBtn.addEventListener("click", function () {
          closeDrawer();
          if (currentDayId === r.id && !openBrandId && !specialOpen) return;
          if (!currentDayId && !specialOpen) goToDay(r.id);
          else showDayView(r.id, null, { replace: true });
        });
        sec.appendChild(dayBtn);
        (r.brands || []).forEach(function (b) {
          var bb = document.createElement("button");
          bb.type = "button";
          bb.className = "drawer-brand";
          bb.textContent = (isSent(b.id) ? "✓ " : "• ") + b.name + " @" + b.handle;
          bb.addEventListener("click", function () {
            closeDrawer();
            ensureDayThenBrand(r.id, b.id);
          });
          sec.appendChild(bb);
        });
        drawerContent.appendChild(sec);
      });
    }

    function openDrawer() {
      drawer.classList.add("open");
      overlay.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
    }
    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

    function restoreFromStorageOrHash() {
      var st = parseHash();
      if (!st.dayId && !st.special) st = readStoredNav();
      applyState(st);
    }

    btnMenu.addEventListener("click", openDrawer);
    overlay.addEventListener("click", closeDrawer);
    btnBack.addEventListener("click", function (e) {
      e.preventDefault();
      backButtonHandler();
    });
    window.addEventListener("popstate", function (ev) {
      var st = ev.state;
      if (!st || typeof st !== "object") st = parseHash();
      applyState(st);
    });
    window.addEventListener("hashchange", function () {
      if (applyingHistory) return;
      applyState(parseHash());
    });
    window.addEventListener("pageshow", function () {
      if (!data) return;
      restoreFromStorageOrHash();
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && data) {
        var st = readStoredNav();
        if (st.special && st.special !== specialOpen) applyState(st);
        else if (st.dayId && st.dayId !== currentDayId) applyState(st);
        else if (st.dayId && st.brandId && st.brandId !== openBrandId) applyState(st);
        else persistNavSilent();
      }
    });

    fetch("data.json?v=" + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error("data.json " + r.status);
        return r.json();
      })
      .then(function (json) {
        data = json;
        var st = parseHash();
        if (!st.dayId && !st.special) st = readStoredNav();
        if (st.special === "cafe" || st.special === "poema") {
          replaceNav(null, null, null);
          history.pushState({ dayId: null, brandId: null, special: st.special }, "", urlFor(null, null, st.special));
          applyState(st);
        } else if (st.dayId && findRound(st.dayId)) {
          replaceNav(null, null, null);
          if (st.brandId) {
            history.pushState({ dayId: st.dayId, brandId: null, special: null }, "", urlFor(st.dayId, null, null));
            history.pushState({ dayId: st.dayId, brandId: st.brandId, special: null }, "", urlFor(st.dayId, st.brandId, null));
          } else {
            history.pushState({ dayId: st.dayId, brandId: null, special: null }, "", urlFor(st.dayId, null, null));
          }
          applyState(st);
        } else {
          replaceNav(null, null, null);
          showDaysView({ skipHistory: true });
        }
      })
      .catch(function (err) {
        elDays.innerHTML = '<p class="empty">Erro ao carregar data.json<br>' + escapeHtml(String(err)) + "</p>";
      });
  })();
  </script>
</body>
</html>
